[package]
name = "pheme"
version = "0.1.5"
edition = "2021"
authors = ["Pheme Contributors <contributors@pheme.dev>"]
description = "CLI tool to generate audio podcast episodes from news using AI personas and semantic memory."
readme = "README.md"
license = "MIT"
repository = "https://github.com/usuario/pheme"
homepage = "https://github.com/usuario/pheme"
keywords = ["podcast", "tts", "ai", "llm", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
inquire = "0.6"
rusqlite = { version = "0.30", features = ["bundled"] }
hound = "3.5"
feed-rs = "1.3"
scraper = "0.18"
slug = "0.1"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
anyhow = "1.0"
colored = "2.0"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.8"
